<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="arc arc-left"></span>
    <span class="arc arc-right"></span>
    <span class="palm palm-left"></span>
    <span class="palm palm-right"></span>
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="orb orb-3"></span>

  <main class="page">

      <p class="brand-agent">Ahmad Nuaman</p>

      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Abstract architectural logo — twin curved arches -->
          <path
            d="M28 22
               C28 22, 34 48, 34 62
               C34 78, 28 98, 28 98
               C42 90, 54 74, 60 60
               C54 46, 42 30, 28 22Z"
            fill="white"/>
          <path
            d="M92 22
               C92 22, 86 48, 86 62
               C86 78, 92 98, 92 98
               C78 90, 66 74, 60 60
               C66 46, 78 30, 92 22Z"
            fill="white"/>
        </svg>
      </div>

      <h1 class="brand-name">HAYAT</h1>

      <div class="brand-line">
        <span class="line"></span>
        <span class="brand-tag">REAL ESTATE</span>
        <span class="line"></span>
      </div>

      <p class="brand-arabic" lang="ar" dir="rtl">عقارات</p>

      <div class="sparkle" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z" fill="#D4AF37"/>
        </svg>
      </div>

      <p class="brand-subtitle" lang="ku" dir="rtl">شوێنی گونجاو بۆ ژیانت دەدۆزینەوە</p>

    <nav class="social-links fade-up" style="--delay: 0.28s" aria-label="Social media links">
      <a class="social-btn" href="https://www.instagram.com/ahmed.realestate98" target="_blank" rel="noopener noreferrer">

        <span class="social-label">INSTAGRAM</span>
        <i class="fa-solid fa-chevron-right social-arrow"></i>
      </a>
      <a class="social-btn" href="https://www.facebook.com/share/1HxeGG1ubJ/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer">

        <span class="social-label">FACEBOOK</span>
        <i class="fa-solid fa-chevron-right social-arrow"></i>
      </a>
      <div class="tiktok-group">
        <button type="button" class="social-btn tiktok-toggle" aria-expanded="false" aria-controls="tiktok-accounts">
          <span class="social-icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
          <span class="social-label">TIKTOK</span>
          <span class="tiktok-badge" aria-hidden="true">2</span>
          <i class="fa-solid fa-chevron-down social-arrow tiktok-chevron"></i>
        </button>
        <div class="tiktok-accounts" id="tiktok-accounts" hidden>
          <a class="tiktok-account" href="https://www.tiktok.com/@ahmadhayatre" target="_blank" rel="noopener noreferrer">
            <span class="social-icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
            <span class="tiktok-account-text">
              <span class="tiktok-account-name">@ahmadhayatre</span>
              <span class="tiktok-account-hint">Account 1</span>

          <a class="tiktok-account" href="https://www.tiktok.com/@ahmadrealestat1" target="_blank" rel="noopener noreferrer">
            <span class="social-icon tiktok"><i class="fa-brands fa-tiktok"></i></span>
            <span class="tiktok-account-text">
              <span class="tiktok-account-name">@ahmadrealestat1</span>
              <span class="tiktok-account-hint">Account 2</span>
            </span>
            <i class="fa-solid fa-arrow-up-right-from-square social-arrow"></i>
          </a>
        </div>
      </div>
      <a class="social-btn" href="https://wa.me/9647504449294" target="_blank" rel="noopener noreferrer">
        <span class="social-icon whatsapp"><i class="fa-brands fa-whatsapp"></i></span>
        <span class="social-label">WHATSAPP</span>
        <i class="fa-solid fa-chevron-right social-arrow"></i>
      </a>

    <footer class="footer fade-up" style="--delay: 0.48s">
      <div class="sparkle" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="12" height="12">
          <path d="M12 2 L13.5 10.5 L22 12 L13.5 13.5 L12 22 L10.5 13.5 L2 12 L10.5 10.5 Z" fill="#D4AF37"/>
        </svg>

          <path d="M4 20 L24 4 L44 20" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 18.5 V36 H38 V18.5" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 36 V24 H28 V36" stroke="#D4AF37" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

      <p class="copyright">© 2026 HAYAT Real Estate</p>
    </footer>

  <script src="script.js"></script>

</html>
